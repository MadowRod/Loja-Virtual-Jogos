spring.application.name=loja-jogos-api

# H2 Database
spring.datasource.url=jdbc:h2:mem:lojajogos
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console (acesso em /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server
server.port=8080

# n8n Webhook
n8n.webhook.url=http://localhost:5678/webhook-test/pedidos

# Steam Store Search API - busca pública, sem necessidade de cadastro ou chave
# (https://store.steampowered.com/api/storesearch). Usada para buscar a capa
# dos jogos pelo nome quando a imagem não é informada no cadastro.
steam.api.busca-url=https://store.steampowered.com/api/storesearch/
steam.api.capa-url=https://cdn.akamai.steamstatic.com/steam/apps/{appid}/header.jpg
